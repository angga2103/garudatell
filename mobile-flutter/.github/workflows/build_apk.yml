name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release

      - name: Prepare Release APK Files
        id: vars
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-release.apk release-files/IPAY-release.apk
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v$VERSION"
          fi
          
          cp build/app/outputs/flutter-apk/app-release.apk release-files/IPAY-${TAG_NAME}.apk
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "GarudaTel iPay Mobile POS ${{ steps.vars.outputs.tag }}"
          body: |
            ## 📱 GarudaTel iPay - Mobile POS (${{ steps.vars.outputs.tag }})

            Aplikasi Android Native Hybrid resmi untuk **GarudaTel iPay (https://ipay.my.id)** dengan integrasi hardware kasir offline-first.

            ### 🌟 Fitur Unggulan (Bluetooth Thermal POS Printer):
            - **Dukungan Printer Kasir Mini Thermal**:
              - Ukuran kertas: **58 mm** (32 karakter) & **80 mm** (48 karakter).
              - Kompatibel dengan berbagai printer: RPP02N, Goojprt, Panda, Iware, VSC, MiniPOS, Zjiang, dsb.
              - Format 2 kolom presisi rata kiri-kanan otomatis (`_formatTwoColumns`).
              - Cetak logo toko raster hitam-putih (`imageRaster`).
              - Cetak hemat kertas (*paper-saving feed 1 baris*).
              - Tombol **Test Print** instan untuk memastikan koneksi printer.
              - Fitur sambung manual via MAC Address jika printer menyembunyikan nama.
            - **Layar Pengaturan Kasir Mandiri**:
              - Status koneksi real-time (hijau saat terhubung / abu-abu saat belum).
              - Akses mandiri kasir tanpa perlu PIN Owner.
              - Tombol pintas **[Kasir Web]** di pojok kanan atas untuk langsung bertransaksi di web kasir PPOB.

            ---
            ### 📥 Download File APK:
            Unduh langsung file `.apk` di bagian **Assets** di bawah:
            - 🔹 **IPAY-release.apk** (Versi rilis universal terbaru)
            - 🔹 **IPAY-${{ steps.vars.outputs.tag }}.apk** (Versi rilis ${{ steps.vars.outputs.tag }})
          files: |
            release-files/IPAY-release.apk
            release-files/IPAY-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
