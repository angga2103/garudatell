<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Fintech Teal - Emerald) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004b44"/>
      <stop offset="50%" stop-color="#008779"/>
      <stop offset="100%" stop-color="#00a08c"/>
    </linearGradient>

    <!-- Golden Dot Gradient -->
    <linearGradient id="goldDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#00221e" flood-opacity="0.45"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Background -->
  <rect x="8" y="8" width="496" height="496" rx="115" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="4"/>

  <!-- 2. Decorative Modern Geo Ring -->
  <circle cx="360" cy="150" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="16"/>
  <circle cx="150" cy="380" r="140" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="24"/>
  <path d="M 100 350 Q 256 420 412 350" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="10" stroke-linecap="round"/>

  <!-- 3. Logo Typography "iPay" -->
  <g filter="url(#dropShadow)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Nunito', sans-serif">
    <!-- Letter 'i' stem -->
    <rect x="135" y="215" width="38" height="110" rx="14" fill="#ffffff"/>
    
    <!-- Letter 'i' golden dot -->
    <circle cx="154" cy="162" r="23" fill="url(#goldDot)" filter="url(#glow)"/>

    <!-- Letters "Pay" -->
    <text x="185" y="325" font-size="150" font-weight="900" fill="#ffffff" letter-spacing="-2">Pay</text>
  </g>

  <!-- 4. Subtitle "GARUDATEL" -->
  <text x="256" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Nunito', sans-serif" font-size="30" font-weight="800" fill="#d2f2ec" letter-spacing="9" text-anchor="middle">GARUDATEL</text>
  
  <!-- Subtle Trust Badge Star -->
  <circle cx="256" cy="425" r="4" fill="#ffeb3b"/>
  <circle cx="236" cy="425" r="2.5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="276" cy="425" r="2.5" fill="rgba(255,255,255,0.5)"/>
</svg>
