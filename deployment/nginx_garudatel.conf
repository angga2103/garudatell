# ==============================================================================
# GarudaTel v2 - Production Nginx Reverse Proxy Configuration
# Salin file ini ke: /etc/nginx/sites-available/garudatel
# Lalu aktifkan: ln -s /etc/nginx/sites-available/garudatel /etc/nginx/sites-enabled/
# ==============================================================================

upstream garudatel_app {
    # Hubungkan ke port TCP 127.0.0.1:5000 Gunicorn
    server 127.0.0.1:5000 fail_timeout=0;
}

# --- REDIRECT HTTP KE HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name ipay.my.id www.ipay.my.id garudatel.com www.garudatel.com;

    # Verifikasi Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- SERVER UTAMA (HTTPS / SSL) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ipay.my.id www.ipay.my.id garudatel.com www.garudatel.com;

    # Konfigurasi Sertifikat SSL (Ganti dengan path domain Anda atau biarkan Certbot mengisinya)
    ssl_certificate /etc/letsencrypt/live/ipay.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipay.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Batasan Ukuran Upload
    client_max_body_size 20M;

    # Logging Akses & Error
    access_log /var/log/nginx/garudatel_access.log;
    error_log /var/log/nginx/garudatel_error.log warn;

    # --- SECURITY HEADERS PRODUKSI ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- KOMPRESI GZIP ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- STATIC FILES CACHING TINGGI ---
    location /static/ {
        alias /var/www/garudatel/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- UPTIME MONITORING & HEALTHCHECK ---
    location /health {
        proxy_pass http://garudatel_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # --- PROXY KE APLIKASI FLASK (GUNICORN) ---
    location / {
        proxy_pass http://garudatel_app;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings untuk provider API
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

